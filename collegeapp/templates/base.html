<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}College Finder | Techno Coders{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background:#253655">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">Techno Coders College Finder</a>
            <div class="navbar-nav ms-auto align-items-lg-center">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'index' %}">Profile</a>
                    <a class="nav-link" href="{% url 'results' %}">Recommendations</a>
                    {% if user.is_staff %}<a class="nav-link" href="{% url 'admin:index' %}">Admin</a>{% endif %}
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button class="btn btn-link nav-link" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Log in</a>
                    <a class="nav-link" href="{% url 'signup' %}">Create account</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
