{% extends "base.html" %}

{% block title %}Log in | College Finder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Student login</h1>
                {% if form.errors %}<div class="alert alert-danger">Username or password was not recognized.</div>{% endif %}
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                        <input class="form-control" id="{{ form.username.id_for_label }}" name="username" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                        <input class="form-control" id="{{ form.password.id_for_label }}" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary" type="submit">Log in</button>
                </form>
                <p class="mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
